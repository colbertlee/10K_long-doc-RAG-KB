[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-kb"
version = "0.4.0"
description = "10K long-document RAG knowledge base"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart",
    "requests",
    "pyyaml",
    "pymupdf>=1.23",
    "pdfplumber>=0.10",
    "python-docx",
    "beautifulsoup4",
    "ollama",
    "httpx",
    "numpy>=2.0.0,<2.8.0",
    "pytest>=8.0",
    "rank-bm25",
    "networkx",
    "psutil",
    "lightrag-hku>=1.5.6",
]

[project.optional-dependencies]
lightrag = ["lightrag-hku"]
sentence-transformers = ["sentence-transformers>=2.3"]
webui = ["open-webui>=0.1.0"]
reranking = ["torch", "transformers", "rank-bm25"]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "pylint>=2.17.0",
    "pytest-cov>=4.0.0",
]
all = [
    "rag-kb[lightrag,sentence-transformers,webui,reranking,dev]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]


