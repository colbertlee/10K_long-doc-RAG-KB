[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-kb"
version = "0.6.0"
description = "10K long-document RAG knowledge base"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart",
    "requests",
    "pyyaml",
    "pymupdf>=1.23",
    "pdfplumber>=0.10",
    "python-docx",
    "beautifulsoup4",
    "lightrag-hku",
    "ollama",
    "httpx",
    "sentence-transformers>=2.3",
    "numpy",
    "pytest>=8.0",
    "pytest-asyncio>=1.0.0",
    "open-webui",
    "pytesseract>=0.3.10",
    "ragas>=0.1",  # For advanced RAG evaluation
    "rank-bm25>=0.2",  # For BM25 sparse search
    "Pillow>=10.0.0",
    "psutil>=5.9.0",  # For system metrics monitoring
]

[project.optional-dependencies]
all = [
    "rag-kb[evaluation]",
    "rag-kb[reranking]",
]

evaluation = [
    "ragas>=0.1",
    "datasets>=2.0",
]

reranking = [
    "sentence-transformers>=2.3",
    "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"