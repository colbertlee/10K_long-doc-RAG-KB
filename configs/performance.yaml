# performance.yaml — Performance-optimized settings for rag-kb
app:
  name: rag-kb
  data_dir: ./data
  lightrag_working_dir: ./lightrag_db
  log_level: WARNING  # Reduce logging overhead

# Performance-optimized embedding settings
embedding:
  provider: ollama
  base_url: http://localhost:11434
  model: nomic-embed-text
  batch_size: 32  # Process embeddings in batches
  cache_enabled: true  # Enable embedding cache

# Performance-optimized LLM settings
llm:
  provider: ollama
  base_url: http://localhost:11434
  model: qwen3.5:4b
  temperature: 0.3
  top_p: 0.9
  max_tokens: 1024  # Reduce token limit for faster responses
  cache_enabled: true  # Enable LLM response cache

# LightRAG performance settings
lightrag:
  embedding_batch_size: 32
  chunk_token_size: 512  # Smaller chunks for faster processing
  chunk_overlap_token_size: 50
  enable_llm_cache: true
  enable_embedding_cache: true
  
  # Query mode performance
  query_mode: hybrid  # Use hybrid mode for best performance/quality balance
  # Options: naive, local, global, hybrid
  
  # Performance tuning
  max_concurrent_requests: 4
  embedding_dim: 768  # Reduce embedding dimension for faster processing
  use_async: true  # Enable async processing

# Chunking performance
chunking:
  strategy: recursive  # Use recursive chunking for better performance
  max_chunk_size: 1000  # Maximum characters per chunk
  chunk_overlap: 100  # Overlap between chunks
  parallel_processing: true  # Enable parallel chunking

# Search performance
search:
  top_k: 5  # Reduce top_k for faster search
  reranking_enabled: false  # Disable reranking for speed
  use_bm25: true  # Use BM25 for fast keyword search
  use_hybrid: true  # Use hybrid search
  cache_results: true  # Cache search results

# Performance monitoring
monitoring:
  enable_metrics: true
  log_slow_queries: true
  slow_query_threshold: 2000  # Log queries slower than 2 seconds
  track_memory_usage: true
  track_cpu_usage: true

# Database performance
database:
  connection_pool_size: 10
  max_overflow: 5
  pool_timeout: 30
  pool_recycle: 3600  # Recycle connections every hour

# API performance
api:
  max_concurrent_requests: 10
  request_timeout: 30
  enable_compression: true  # Enable response compression
  rate_limit_enabled: false  # Disable rate limiting for performance